server.port=8080

# Limity rozmiaru przesyłanych plików multimedialnych
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Konfiguracja bazy danych PostgreSQL (Lokalny kontener lub AWS RDS)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cloudapp}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Przełączniki trybu pracy (lokalnie false, w Terraform na AWS true)
app.aws-enabled=${APP_AWS_ENABLED:false}
app.auth-enabled=${APP_AUTH_ENABLED:false}
app.aws-region=${AWS_REGION:us-east-1}
app.s3-bucket=${S3_BUCKET_NAME:local-bucket}
app.cognito-issuer-uri=${COGNITO_ISSUER_URI:}
